services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polo_connect
      POSTGRES_USER: polo_local
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - polo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polo_local -d polo_connect"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  polo_data:
